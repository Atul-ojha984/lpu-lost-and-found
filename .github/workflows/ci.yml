name: Continuous Integration

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Quality & Build Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck:web

      - name: ESLint Check
        run: npm run lint

      - name: Production Build
        run: npm run build:web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1

  backend:
    name: Django Backend Checks & Pytest Suite
    runs-on: ubuntu-latest
    env:
      DEBUG: "True"
      SECRET_KEY: "ci-dummy-secret-key-for-testing-only-minimum-50-chars-long!"
      DATABASE_URL: "sqlite:///test_db.sqlite3"
      JWT_SIGNING_KEY: "ci-dummy-jwt-signing-key-minimum-32-chars!"
      FIELD_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0"
      SECURE_SSL_REDIRECT: "False"
      SESSION_COOKIE_SECURE: "False"
      CSRF_COOKIE_SECURE: "False"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Django System Integrity Check
        run: python backend/manage.py check

      - name: Run Pytest Test Suite
        working-directory: backend
        run: pytest tests/ -v
