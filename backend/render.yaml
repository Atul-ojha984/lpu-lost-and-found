services:
  - type: web
    name: lpu-lost-found-backend-django
    runtime: python
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3"
    plan: standard
    region: singapore
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: DJANGO_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SIGNING_KEY
        generateValue: true
      - key: FIELD_ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: lpu-lost-found-postgres
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com,lostfound.lpu.in,api-lostfound.lpu.in"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://lpu-lost-found.vercel.app,https://lostfound.lpu.in"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://lpu-lost-found.vercel.app,https://lostfound.lpu.in,https://*.onrender.com"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"

databases:
  - name: lpu-lost-found-postgres
    plan: standard
    region: singapore
    postgresMajorVersion: 16
