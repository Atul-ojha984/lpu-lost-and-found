  /api/v1/admin/audit-logs:
    get:
      operationId: api_v1_admin_audit_logs_retrieve
      description: Authorized audit history search with strict redaction of sensitive
        credentials.
      summary: Search Audit History Logs
      parameters:
      - in: query
        name: action
        schema:
          type: string
        description: Filter by audit action
      - in: query
        name: actorId
        schema:
          type: string
        description: Actor UUID
      - in: query
        name: endDate
        schema:
          type: string
        description: ISO 8601 end timestamp
      - in: query
        name: limit
        schema:
          type: integer
        description: Page size (default 20, max 100)
      - in: query
        name: page
        schema:
          type: integer
        description: Page number (default 1)
      - in: query
        name: startDate
        schema:
          type: string
        description: ISO 8601 start timestamp
      - in: query
        name: targetEntity
        schema:
          type: string
        description: Target entity name (Item, Claim, User)
      tags:
      - Administration
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: Paginated audit logs
  /api/v1/admin/audit-logs/:
    get:
      operationId: api_v1_admin_audit_logs_retrieve_2
      description: Authorized audit history search with strict redaction of sensitive
