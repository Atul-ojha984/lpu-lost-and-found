openapi: 3.0.3
info:
  title: LPU Lost & Found Property Recovery API
  version: 1.0.0
  description: Comprehensive REST API documentation for Lovely Professional University
    campus lost and found management platform.
paths:
  /:
    get:
      operationId: root_retrieve
      description: |-
        Public Welcome Endpoint
        Matches the Express root endpoint for deployment smoke tests and perimeter health checks.
      summary: Root Welcome & Service Status
      tags:
      - Health
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: Welcome message
  /api/v1:
    get:
      operationId: api_v1_retrieve
      description: |-
        API v1 Root Discovery & Service Catalog Endpoint
        Serves requests to http://localhost:8000/api/v1 and http://localhost:8000/api/v1/.
      summary: API v1 Root Service Discovery & Endpoints Catalog
      tags:
      - Health
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: API v1 service catalog and links
  /api/v1/:
    get:
      operationId: api_v1_retrieve_2
      description: |-
        API v1 Root Discovery & Service Catalog Endpoint
        Serves requests to http://localhost:8000/api/v1 and http://localhost:8000/api/v1/.
