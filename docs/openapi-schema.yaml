components:
  schemas:
    ActionBc9Enum:
      enum:
      - INITIAL_INTAKE
      - TRANSFERRED_DESK
      - STORED_IN_LOCKER
      - INSPECTION
      - HANDED_OVER
      - DISPOSED
      type: string
      description: |-
        * `INITIAL_INTAKE` - Initial Property Intake
        * `TRANSFERRED_DESK` - Transferred to Security Desk
        * `STORED_IN_LOCKER` - Stored in Secure Locker
        * `INSPECTION` - Physical Property Inspection
        * `HANDED_OVER` - Handed Over to Verified Claimant
        * `DISPOSED` - Disposed / Transferred to Donation
    AdminUser:
      type: object
      description: Admin user listing and management serializer.
      properties:
        _id:
          type: string
          readOnly: true
          title: ' id'
        id:
          type: string
          format: uuid
          readOnly: true
        registrationNumber:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        fullName:
          type: string
          readOnly: true
        role:
          $ref: '#/components/schemas/RoleEnum'
        department:
          type: string
          maxLength: 150
        securityPost:
          type: string
          readOnly: true
        phone:
          type: string
          maxLength: 20
        isActive:
          type: boolean
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - _id
      - createdAt
      - email
      - fullName
      - id
      - isActive
      - registrationNumber
      - securityPost
    AnswerChallengeInputRequest:
      type: object
      description: Input serializer for answering an individual verification challenge.
      properties:
        answer:
          type: string
          minLength: 1
      required:
      - answer
    AuditActorBrief:
      type: object
      description: Sanitized actor representation for audit entries.
      properties:
        _id:
          type: string
          readOnly: true
          title: ' id'
        id:
          type: string
          format: uuid
          readOnly: true
        fullName:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        registrationNumber:
          type: string
          readOnly: true
        role:
          $ref: '#/components/schemas/RoleEnum'
        securityPost:
          type: string
          readOnly: true
      required:
      - _id
      - email
      - fullName
      - id
      - registrationNumber
      - securityPost
    AuditEntry:
      type: object
      description: Sanitized compliance audit log serializer.
      properties:
        _id:
          type: string
          readOnly: true
          title: ' id'
        id:
          type: string
          format: uuid
          readOnly: true
        actor:
          allOf:
          - $ref: '#/components/schemas/AuditActorBrief'
          readOnly: true
        actorRole:
          type: string
          readOnly: true
        action:
          $ref: '#/components/schemas/AuditEntryActionEnum'
        targetEntity:
          type: string
          readOnly: true
        targetId:
          type: string
          readOnly: true
        ipAddress:
          type: string
          readOnly: true
        userAgent:
          type: string
          readOnly: true
        metadata: {}
        timestamp:
          type: string
          format: date-time
      required:
      - _id
      - action
      - actor
      - actorRole
      - id
      - ipAddress
      - targetEntity
      - targetId
      - userAgent
    AuditEntryActionEnum:
      enum:
      - USER_REGISTER
      - USER_LOGIN
      - USER_LOGOUT
      - ITEM_REPORT_LOST
      - ITEM_REPORT_FOUND
      - PRIVATE_VAULT_VIEW
      - CLAIM_SUBMIT
      - CLAIM_REVIEW
      - HANDOVER_OTP_GENERATE
      - HANDOVER_EXECUTE
      - CUSTODY_TRANSFER
      - CUSTODY_INTAKE
      - ITEM_DISPOSE
      - ROLE_UPDATE
      - CATEGORY_MANAGE
      - LOCATION_MANAGE
      - CONFIG_UPDATE
      type: string
      description: |-
        * `USER_REGISTER` - User Registration
        * `USER_LOGIN` - User Login
        * `USER_LOGOUT` - User Logout
        * `ITEM_REPORT_LOST` - Report Lost Property
        * `ITEM_REPORT_FOUND` - Report Found Property
        * `PRIVATE_VAULT_VIEW` - View Private Vault
        * `CLAIM_SUBMIT` - Submit Ownership Claim
        * `CLAIM_REVIEW` - Review Ownership Claim
        * `HANDOVER_OTP_GENERATE` - Generate Handover OTP
        * `HANDOVER_EXECUTE` - Execute Property Handover
        * `CUSTODY_TRANSFER` - Transfer Physical Custody
        * `CUSTODY_INTAKE` - Initial Custody Intake
        * `ITEM_DISPOSE` - Approve Item Disposal
        * `ROLE_UPDATE` - Update User Role
        * `CATEGORY_MANAGE` - Manage Categories
        * `LOCATION_MANAGE` - Manage Locations
        * `CONFIG_UPDATE` - Update Platform Configuration
    ChallengeAnswerInputRequest:
      type: object
      properties:
        challengeId:
          type: string
          minLength: 1
        providedAnswer:
          type: string
          minLength: 1
      required:
      - challengeId
      - providedAnswer
    Claim:
      type: object
      description: Unified Claim serializer for claimant view and security queue.
      properties:
        _id:
          type: string
          readOnly: true
          title: ' id'
        id:
          type: string
          format: uuid
          readOnly: true
        itemId:
          type: string
          readOnly: true
        itemTitle:
          type: string
          readOnly: true
        itemReference:
          type: string
          readOnly: true
        itemType:
          type: string
          readOnly: true
        item:
          allOf:
          - $ref: '#/components/schemas/PublicItem'
          readOnly: true
        claimant:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        claimStatus:
          type: string
        statement:
          type: string
          maxLength: 2000
        challengeAnswers:
          type: array
          items:
            $ref: '#/components/schemas/ClaimChallengeAnswer'
          readOnly: true
        privateEvidenceProofUrls: {}
        reviewedBy:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        reviewedAt:
          type: string
          format: date-time
          readOnly: true
        reviewNotes:
          type: string
        rejectionReason:
          type: string
        handoverOtp:
          type: string
          readOnly: true
        verificationAttemptsCount:
          type: integer
        createdAt:
          type: string
          format: date-time
          readOnly: true
        submittedAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - _id
      - challengeAnswers
      - claimStatus
      - claimant
      - createdAt
      - handoverOtp
      - id
      - item
      - itemId
      - itemReference
      - itemTitle
      - itemType
      - privateEvidenceProofUrls
      - rejectionReason
      - reviewNotes
      - reviewedAt
      - reviewedBy
      - statement
      - submittedAt
      - verificationAttemptsCount
    ClaimChallengeAnswer:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        challengeId:
          type: string
        questionText:
          type: string
          readOnly: true
        providedAnswer:
          type: string
        isCorrect:
          type: boolean
      required:
      - challengeId
      - id
      - isCorrect
      - providedAnswer
      - questionText
    ConfidenceEnum:
      enum:
      - HIGH
      - MEDIUM
      - LOW
      type: string
      description: |-
        * `HIGH` - High Confidence
        * `MEDIUM` - Medium Confidence
        * `LOW` - Low Confidence
    CreateCategoryRequest:
      type: object
      description: Admin category creation input.
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 50
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          default: ''
        icon:
          type: string
          default: ''
        defaultRetentionDays:
          type: integer
          default: 90
        isActive:
