      responses:
        '200':
          description: API v1 service catalog and links
  /api/v1/admin/analytics:
    get:
      operationId: api_v1_admin_analytics_retrieve
      description: |-
        Live analytics dashboard calculated strictly from live database records.
        Restricted to campus and system administrators.
      summary: Get Campus Lost & Found Analytics
      tags:
      - Administration
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: Calculated campus property analytics
  /api/v1/admin/analytics/:
